# apps/web/nginx.conf — 全棧 demo 的唯一對外入口（Feature 008；research D1、contracts §2）
#
# 兩件事由同一個 nginx 承擔：
#   1. 靜態伺服 vite build 產物（含 SPA fallback）
#   2. /ws 與 /diagnoses 同源反向代理至 api:3000
# 前端原始碼零改動——它本來就走同源相對路徑（research D1／D2）。

# Docker 內建 DNS，讓 upstream 延後解析（見 location 內 proxy_pass 的說明）。
resolver 127.0.0.11 valid=10s ipv6=off;

# /diagnoses 的限流區。本檔被 COPY 成 /etc/nginx/conf.d/default.conf，由主設定在 http 區塊內 include，
# 故檔案頂層即 http 層——limit_req_zone 只能寫在 http 層（寫進 server／location 會讓 nginx 拒絕啟動）。
# 每個 client IP 10 次／分鐘：每次 POST 都會排入一個 LLM 診斷 job（耗 API 配額），demo 無認證時
# 這是唯一的濫用煞車。1m 共享記憶體約可容納 1.6 萬個 IP 的狀態，demo 規模綽綽有餘。
# 注意 $binary_remote_addr 是 nginx 看到的來源：Docker Desktop（Windows／macOS）或 userland-proxy 下
# 一律是 docker gateway，等於全體共用一個桶（多人示範會互相卡到 429）；Linux 直連時才是每個 client IP。
limit_req_zone $binary_remote_addr zone=diag:1m rate=10r/m;

server {
    # 8080 而非 80：runtime 為 nginxinc/nginx-unprivileged（非 root，無法 bind <1024 的埠）。
    # compose 的 ports（${WEB_BIND:-127.0.0.1}:8080:8080）與 healthcheck 皆對齊此值。
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不在 Server header 與錯誤頁洩漏 nginx 版本（縮小指紋、少給攻擊者版本比對 CVE 的線索）。
    server_tokens off;

    # gzip：JS bundle 約 180 kB → 約 59 kB。text/html 為 nginx 預設即壓縮，不必列。
    # .js 的 MIME 依 nginx 版本為 application/javascript 或 text/javascript，兩者都列。
    # gzip_vary 讓中間快取依 Accept-Encoding 分開存放；小於 1 KB 的回應壓縮不划算。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # ---- 安全 header ----
    # 注意 nginx 的繼承規則：location 內只要出現任何 add_header，就「完全不繼承」server 層的 add_header。
    # 故下方 /assets/ 與 = /index.html 兩個設了 Cache-Control 的 location MUST 重複列出這四行；
    # 改這裡時三處一起改。`always` 使 4xx/5xx 回應也帶上。
    #
    # CSP 逐項理由（依 apps/web/index.html 與 vite build 產物實測）：
    #   script-src 'self'          — 只有 /assets/*.js 一支 module script，無 inline script、無 eval
    #   style-src 'self' + Google Fonts CSS — index.html 以 <link> 載入 fonts.googleapis.com 的字型 CSS；
    #                                Vue 的 :style 綁定走 CSSOM（el.style），不受 style-src 限制，故不需 'unsafe-inline'
    #   font-src fonts.gstatic.com — 上述字型 CSS 內的 @font-face 實體檔
    #   connect-src 'self'         — 打包程式只連同源 /ws 與 POST /diagnoses；CSP3 的 'self' 已涵蓋同源 ws/wss。
    #                            若需相容不支援此行為的舊 Safari（<15.4 前後），再加回 ws: wss:
    #   frame-ancestors 'none'     — 等同 X-Frame-Options: DENY（新瀏覽器以此為準，舊瀏覽器看 XFO）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # api 的 upstream 以「變數」承載——搭配上方 resolver 讓解析延後到請求當下、每 10s 失效重查。
    # 若寫成字面 proxy_pass http://api:3000;，nginx 只在啟動時解析一次並「永久快取」，api 崩潰
    # 重啟後若換 IP，nginx 會持續轉發到失效位址——症狀是「web 入口載入正常、通道永遠連不上」，
    # 直接使 SC-003 失敗且與「重啟上限耗盡」同形、極難診斷（research D1「upstream 解析」）。
    set $api_upstream api:3000;

    # /ws：WebSocket 反向代理。MUST 帶升級標頭——漏任一項握手會退化為一般 HTTP 而失敗
    # （HTTP/1.0 不支援 upgrade）。這是入口拓樸的單點故障處（research D1、contracts §2）。
    location /ws {
        # proxy_pass 後不接 URI 路徑（http://$api_upstream; 而非 .../），保留原始請求 URI 不被改寫。
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 移除與 dev（vite proxy 無此上限）不一致的隱形計時器——api 的 WS_HEARTBEAT_MS 使通道
        # 不會靜默，預設 60s 其實夠用；設 3600s 是消除一個 FR-014 的行為變因（research D1）。
        proxy_read_timeout 3600s;
    }

    # /diagnoses：POST 診斷觸發，同源反向代理（005 research R2、contracts §2）。
    location /diagnoses {
        # burst=5 nodelay：容許使用者連點數次立即放行，超過即回 429（而非預設 503，讓前端與日誌
        # 看得出是限流而非 api 故障）。
        limit_req zone=diag burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # vite build 產物：檔名帶內容 hash（index-<hash>.js），內容變了檔名就變，可放心永久快取。
    # 找不到就 404（不 fallback 到 index.html——否則舊 hash 的請求會拿到 HTML 被當 JS 解析）。
    location /assets/ {
        try_files $uri =404;
        # Cache-Control 刻意不加 always：404 等錯誤回應不該被瀏覽器以 immutable 快取一年。
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 見 server 層說明：此處有 add_header，安全 header MUST 重複列出。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # index.html 是唯一不帶 hash、卻指向最新 hash 檔名的入口：MUST 每次回源驗證（no-cache = 可存但
    # 用前必須 revalidate），否則重新部署後瀏覽器仍拿舊 index.html 去要已不存在的舊 bundle。
    # SPA fallback（下方 try_files 的 /index.html）也會內部轉到這裡，同樣套用。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # 見 server 層說明：此處有 add_header，安全 header MUST 重複列出。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # 靜態產物 + SPA fallback：未知路徑回 index.html（非 nginx 的預設 404），與 vite dev 一致。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
