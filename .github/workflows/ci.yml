name: ci

# 觸發：所有分支的 push 自動跑，另保留手動觸發（2026-10-21 恢復，第三輪審查 DOC-18，使用者裁決）。
# - 為何是 push：本 repo 不開 PR，合併一律本機 `git merge --no-ff` 後 push develop；只開 pull_request 等於 CI 永不自動跑。
#   2026-06-30 起曾只留 workflow_dispatch（`6417069`），理由「私有 repo 期間節省 Actions 分鐘」在 repo 公開後已不成立：
#   公開 repo 的標準 runner 不計分鐘，一次約 2 分鐘（2026-10-18 實測），連續 push 由下方 concurrency 取消舊 run。
# - 為何不加 pull_request：同 repo 分支開 PR 時 push 與 pull_request 會讓同一個 commit 跑兩次。
#   代價：外部 fork 的 PR 不會自動跑；需要時由維護者把 fork 分支拉進本 repo 後手動觸發（workflow_dispatch 只能跑本 repo 的 ref），或改用 pull_request。
# - 為何只限 branches：tag 不觸發。release 時 `git push origin main --follow-tags` 的 main 已經會跑，tag 再跑一次是重複。
on:
  push:
    branches: ["**"]
    # 只改文件的 push 不跑；但測試會讀的 Markdown 不能略過，否則改壞了也不會紅燈。
    # GitHub 的 paths-ignore 不支援 `!` 例外，所以改用 paths：先全收、再排除文件、最後加回測試讀取的檔（後面的規則優先）。
    # 加回的三個檔與讀取它們的測試：
    #   README.md                              ← apps/{api,worker}/src/lib/readme-env-table.test.ts、packages/contracts/src/docs-contract-version.test.ts
    #   CHANGELOG.md                           ← packages/contracts/src/docs-contract-version.test.ts
    #   docs/Flow-Gatekeeper-SDD-完整實作指南.md ← packages/contracts/src/docs-contract-version.test.ts
    # 新增讀取 Markdown 或 docs/ 檔案的測試時 MUST 把該檔加回這份清單。
    # GitHub 的 paths 過濾只看一次 push diff 的前 300 個變更檔：超大 merge 若沒自動跑，用 workflow_dispatch 補跑。
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/Flow-Gatekeeper-SDD-*.md"
  workflow_dispatch: # Actions 頁可手動 Run workflow（例如只改文件、想補跑一次時）

# 最小權限：本流程只需讀取原始碼（上傳 artifact 走 Actions 內建 token，不需 contents: write）。
permissions:
  contents: read

# 同一分支重複觸發時取消舊 run，只保留最新一次：同分支連續 push 時以最新一次為準；
# 主支的合併節點若被後續 push 取消，用 workflow_dispatch 補跑。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# actions 維持以 tag 引用、不釘 commit SHA：目前沒有 dependabot／renovate 之類的自動更新機制，
# 釘 SHA 只會讓版本默默過期；日後導入自動更新時再改釘 SHA。

jobs:
  check:
    runs-on: ubuntu-latest
    # 目前全流程約 2 分鐘（2026-10-18 實測）；設上限避免卡死的 run 空耗分鐘數。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # 與 Dockerfile（node:22.23.4-alpine）、root engines 同一來源：.nvmrc
          node-version-file: .nvmrc
          cache: pnpm
      # 不需先 build packages/*：typecheck／test 透過 exports 的 "development" condition 直接吃 src。
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:lint
      - run: pnpm typecheck
      - run: pnpm lint
      # 以 test:coverage 取代 `pnpm test`：root vitest.config.ts 的 test.projects 跑的是同一批（五個套件）
      # 測試，另外產出合併覆蓋率並檢查不退步門檻；兩者都跑只會把單元測試重跑一遍。
      - run: pnpm test:coverage
      - name: 上傳覆蓋率報告（lcov）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      # 最後走一次 production 建置路徑（customConditions: [] → 解析 dist），
      # 補上 typecheck 改吃 src 後不再覆蓋到的「packages build → apps 依 dist 編譯」這段。
      - run: pnpm build

  # prod 依賴的資安門檻（2026-10-23，使用者裁決：拆成獨立 job、與 check 並行；permissions／concurrency／觸發沿用上方 workflow 層級設定）。
  # 防止新的 prod 依賴把 critical／high 帶進正式環境：只看 prod、只擋 high 以上，dev-only 的公告不會擋。
  # 既有 prod 依賴出新公告時也會紅燈：先升級或加 override；確定是誤報（例如公告已撤銷但 registry 未更新）時，
  # 在 root package.json 的 `pnpm.auditConfig.ignoreGhsas` 列入，並附理由與移除條件。
  # 不加 `--ignore-registry-errors`：registry 故障時寧可紅燈，也不悄悄跳過檢查。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4   # 版本讀 root package.json 的 packageManager
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # 不裝依賴、不設 cache：pnpm audit 只讀 pnpm-lock.yaml；lockfile 能否安裝由並行的 check job 驗證（2026-10-23，使用者裁決）。
      - run: pnpm audit --prod --audit-level=high
