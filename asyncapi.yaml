asyncapi: 2.6.0
info:
  title: flow-gatekeeper Realtime Events
  version: 1.4.0
  description: >-
    WebSocket events for telemetry, diagnosis jobs, and AI streaming.

    Companion HTTP endpoint (not a WebSocket channel; request and 200 body are defined by Zod in
    packages/contracts/src/http.ts, error bodies are documented here only):
    GET /diagnoses/{jobId}?socketId={uuid}[&previousSocketId={uuid}] reads a diagnosis result or re-binds an
    in-flight job to the calling connection after a reconnect. The jobId (UUID v4) acts as a bearer capability:
    any online, authorized connection that knows it can read a finished result; it appears in the nginx access log path.
    socketId must be an online, authorized WebSocket clientId (the same gate as POST /diagnoses). previousSocketId is
    the socketId the caller's tab last bound to this job; it is only used for the re-bind decision.

    200 responses, discriminated by status (every branch carries jobId):
    completed carries the validated result and cached (from the BullMQ return value, or from MongoDB with
    cached false when the job is gone, in an unknown state, or its return value fails validation);
    failed carries error (the BullMQ failedReason);
    waiting (also covering delayed, prioritized and waiting-children) and active carry optional progress,
    attempt and execution, and rebound true, meaning subsequent job/status and ai/* events go to this socketId.

    Error responses (Nest HttpException bodies, no separate schema):
    400 when params or query do not match the contract (body lists issue path and code only, input is not echoed);
    404 when neither BullMQ nor MongoDB holds a valid result (completed jobs are removed from BullMQ after 1 hour;
    cache-hit results are not stored in MongoDB, so they return 404 afterwards);
    409 with code socket_unauthorized when socketId is not online or not authorized (same message as POST /diagnoses);
    409 with code job_bound_elsewhere when the job is still in flight and bound to another online connection that is
    neither this socketId nor previousSocketId; the code field appears only on these GET 409 responses, the POST 409
    body is unchanged;
    429 when the nginx diag_read limit (60 requests per minute, burst 10, separate from POST) is exceeded (nginx error
    page, not JSON);
    503 when Redis or MongoDB is unavailable, or the BullMQ lookup exceeds 5 seconds or the MongoDB query exceeds
    3 seconds (8 seconds in total at most); also returned for rare inconsistent states (terminal binding while the
    queue still reports the job in progress; job data without machineId); retry later.
  contact:
    name: flow-gatekeeper
    url: https://github.com/flow-gatekeeper
    email: dev@flow-gatekeeper.local
  license:
    name: MIT

tags:
  - name: telemetry
    description: High-frequency machine telemetry channels.
  - name: diagnosis
    description: Diagnosis job lifecycle and AI streaming channels.

servers:
  local:
    url: ws://localhost:3000/ws
    protocol: ws

channels:
  machine/subscribe:
    publish:
      operationId: machineSubscribe
      summary: Client subscribes to machine telemetry.
      description: >-
        Client sends a subscribe control message with auth token and the machine ids it wants telemetry for.
        Inbound rate limit (shared by every client-to-server message on the connection, i.e. machine/subscribe
        and ping): token bucket per connection, refilled at 20 messages per second with a burst capacity of 40.
        A message arriving while the bucket is empty is dropped without parsing and counts as one violation;
        malformed messages, schema mismatches, invalid tokens and rate-limited messages share the same per-connection
        violation counter, and reaching WS_MAX_VIOLATIONS (10) closes the connection with code 1008.
      message:
        $ref: "#/components/messages/MachineSubscribe"

  machine/data:
    subscribe:
      operationId: machineData
      summary: Server pushes high-frequency machine telemetry.
      description: >-
        Server streams telemetry points for subscribed machines at high frequency. Each frame is a
        bare JSON array of TelemetryPoint (no envelope); each element carries its own type.
      message:
        $ref: "#/components/messages/MachineData"

  job/status:
    subscribe:
      operationId: jobStatus
      summary: Server pushes diagnosis job status.
      description: >-
        Server emits lifecycle status updates for a diagnosis job. A `completed` status carries the validated `result` and `cached`
        whenever the worker's return value passes validation; this is the authoritative completion signal. `attempt`/`execution`
        accompany progress updates; `reason: stalled` marks a re-dispatch after the worker lost its lock. When WS_AUTH_SECRET is set, it
        is sent only to authorized connections.
      message:
        $ref: "#/components/messages/JobStatus"

  ai/token:
    subscribe:
      operationId: aiToken
      summary: Server pushes streamed AI token chunks.
      description: Server forwards streamed AI token chunks for an in-progress diagnosis job. When WS_AUTH_SECRET is set, it is sent only to authorized connections (those that passed the machine/subscribe token check).
      message:
        $ref: "#/components/messages/AiToken"

  ai/done:
    subscribe:
      operationId: aiDone
      summary: Server pushes final AI diagnosis.
      description: >-
        Server forwards the validated final diagnosis result for a job, flagging whether it was served from cache. `ai/done` is a
        best-effort notification. It MAY be delivered more than once for the same jobId (re-execution after a stalled lock or a retry
        always carries the same result) and MAY be lost (Redis Pub/Sub is at-most-once). The authoritative completion is `job/status`
        with `status: completed` and `result`; consumers MUST treat the first completion they receive for a jobId as final and ignore
        later ones. When WS_AUTH_SECRET is set, it is sent only to authorized connections (those that passed the machine/subscribe token check).
      message:
        $ref: "#/components/messages/AiDone"

  ai/error:
    subscribe:
      operationId: aiError
      summary: Server pushes AI provider or worker errors.
      description: Server emits an error event when the AI provider or worker fails for a job. When WS_AUTH_SECRET is set, it is sent only to authorized connections (those that passed the machine/subscribe token check).
      message:
        $ref: "#/components/messages/AiError"

  ping:
    publish:
      operationId: ping
      summary: Client application-level heartbeat request.
      description: >-
        Client sends an application-level heartbeat; server replies with pong, including while the connection's
        send buffer is above WS_SEND_HIGH_WATER_BYTES (amplification is bounded by the inbound rate limit). This is
        the only client-initiated liveness check: protocol-level ping frames (opcode 0x9) sent by the client are not
        answered (the server WebSocket has autoPong disabled). Subject to the per-connection
        inbound rate limit described on machine/subscribe (20 messages per second, burst 40; excess counts as a
        violation, WS_MAX_VIOLATIONS closes with 1008).
      message:
        $ref: "#/components/messages/Ping"

  system/connected:
    subscribe:
      operationId: systemConnected
      summary: Server confirms the connection and assigns a client id.
      description: Sent once per connection right after the socket opens.
      message:
        $ref: "#/components/messages/SystemConnected"

  machine/subscribed:
    subscribe:
      operationId: machineSubscribed
      summary: Server acknowledges a subscription with the current machine id set.
      description: Sent after a valid subscribe; the machineIds reflect the new authoritative set.
      message:
        $ref: "#/components/messages/MachineSubscribed"

  pong:
    subscribe:
      operationId: pong
      summary: Server reply to an application-level ping.
      description: >-
        Server replies with pong (carrying a timestamp) to a client application-level ping, regardless of send-buffer
        backpressure. Protocol-level ping frames sent by the client get no protocol-level pong; clients must use the
        application-level ping message to check liveness.
      message:
        $ref: "#/components/messages/Pong"

  system/unauthorized:
    subscribe:
      operationId: systemUnauthorized
      summary: Server rejects a subscribe request carrying an invalid token.
      description: Server emits this when a subscribe request fails token authorization; no subscription is created.
      message:
        $ref: "#/components/messages/SystemUnauthorized"

  system/metrics:
    subscribe:
      operationId: systemMetrics
      summary: Server broadcasts a periodic operational metrics summary.
      description: >-
        Emitted every METRICS_INTERVAL_MS (default 60000, floor 5000) to every authorized client
        (every connected client when WS_AUTH_SECRET is unset; otherwise only clients that passed the
        machine/subscribe token check), independent of which machines are subscribed. Delivery is at-most-once; a missed summary is never
        resent. The worker half is null when the worker snapshot is absent, expired, or malformed.
      message:
        $ref: "#/components/messages/SystemMetrics"

components:
  messages:
    MachineSubscribe:
      payload:
        type: object
        required: [type, token, machineIds]
        properties:
          type:
            const: machine/subscribe
          token:
            type: string
            maxLength: 512
          machineIds:
            type: array
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 64

    MachineData:
      payload:
        type: array
        items:
          $ref: "#/components/schemas/TelemetryPoint"

    JobStatus:
      payload:
        type: object
        required: [type, jobId, machineId, status]
        properties:
          type:
            const: job/status
          jobId:
            type: string
          machineId:
            type: string
          status:
            enum: [waiting, active, completed, failed]
          progress:
            type: number
            minimum: 0
            maximum: 100
          result:
            $ref: "#/components/schemas/DiagnosisResult"
          error:
            type: string
          attempt:
            type: integer
            minimum: 1
            description: BullMQ attempt number (attemptsMade + 1), same meaning as attempt on ai/* messages. Sent with progress updates on active and, when known, on completed. Clients reset accumulated stream text when it increases.
          execution:
            type: integer
            minimum: 1
            description: Number of times the job has started executing (BullMQ attemptsStarted). Increments on retries, stalled re-dispatches and rate-limit delays; clients reset accumulated stream text when it increases. An increase does not by itself mean the worker crashed.
          reason:
            type: string
            description: Open-ended reason for the status change (deliberately not an enum, so adding a value never makes old clients drop the whole message). Known value stalled, sent with status waiting when BullMQ re-queues the job after the worker lost its lock. Consumers MUST ignore unknown values.
          cached:
            type: boolean
            description: Whether the result was served from cache. Always present when status is completed and result is present; consumers treat a missing value as false.

    AiToken:
      payload:
        type: object
        required: [type, jobId, attempt, seq, text]
        properties:
          type:
            const: ai/token
          jobId:
            type: string
          attempt:
            type: integer
            minimum: 1
            description: BullMQ attempt number (attemptsMade + 1). The job id is reused across retries and seq restarts at 0, so clients reset accumulated stream text when this changes. A stalled re-dispatch (worker crash) does not increment attemptsMade, so seq also restarts at 0 within the same attempt; within the same attempt, seq strictly increases during one execution, so clients treat any seq that does not increase (seq <= the previous seq) as a new execution and reset as well.
          seq:
            type: integer
          text:
            type: string

    AiDone:
      payload:
        type: object
        required: [type, jobId, attempt, cached, result]
        properties:
          type:
            const: ai/done
          jobId:
            type: string
          attempt:
            type: integer
            minimum: 1
            description: BullMQ attempt number (attemptsMade + 1). The job id is reused across retries and seq restarts at 0, so clients reset accumulated stream text when this changes. A stalled re-dispatch (worker crash) does not increment attemptsMade, so seq also restarts at 0 within the same attempt; within the same attempt, seq strictly increases during one execution, so clients treat any seq that does not increase (seq <= the previous seq) as a new execution and reset as well.
          cached:
            type: boolean
          result:
            $ref: "#/components/schemas/DiagnosisResult"

    AiError:
      payload:
        type: object
        required: [type, jobId, attempt, code, message]
        properties:
          type:
            const: ai/error
          jobId:
            type: string
          attempt:
            type: integer
            minimum: 1
            description: BullMQ attempt number (attemptsMade + 1). The job id is reused across retries and seq restarts at 0, so clients reset accumulated stream text when this changes. A stalled re-dispatch (worker crash) does not increment attemptsMade, so seq also restarts at 0 within the same attempt; within the same attempt, seq strictly increases during one execution, so clients treat any seq that does not increase (seq <= the previous seq) as a new execution and reset as well.
          code:
            type: string
            description: >-
              Open-ended error code (not an enum). Known values: ai_timeout (worker, stream timed out; retryable);
              provider_error (worker, AI provider failure; retryability depends on the provider error);
              schema_invalid (worker, result failed schema validation, safety or max_tokens; retryable for validation
              failures, not for safety or max_tokens);
              no_context (worker, empty diagnosis context; not retryable);
              persist_failed (worker, the diagnoses record could not be written; message is fixed to
              "persist_failed: diagnosis record could not be written"; retryable; added in 1.4.0);
              worker_failed (api, final-failure safety net; message is the BullMQ failedReason).
              A job that hits a same-signature failure marker receives the same code as the lock holder, with no extra flag.
          message:
            type: string

    Ping:
      payload:
        type: object
        required: [type]
        properties:
          type:
            const: ping

    SystemConnected:
      payload:
        type: object
        required: [type, clientId]
        properties:
          type:
            const: system/connected
          clientId:
            type: string

    MachineSubscribed:
      payload:
        type: object
        required: [type, machineIds]
        properties:
          type:
            const: machine/subscribed
          machineIds:
            type: array
            items:
              type: string

    Pong:
      payload:
        type: object
        required: [type, ts]
        properties:
          type:
            const: pong
          ts:
            type: integer

    SystemUnauthorized:
      payload:
        type: object
        required: [type]
        properties:
          type:
            const: system/unauthorized

    SystemMetrics:
      payload:
        type: object
        required: [type, windowMs, collectedAt, queue, wsConnections, worker]
        properties:
          type:
            const: system/metrics
          windowMs:
            type: integer
            minimum: 1
            description: Window covered by this summary (equals METRICS_INTERVAL_MS). Clients derive the staleness threshold (2x) from this field and MUST NOT hardcode it.
          collectedAt:
            type: string
            format: date-time
            description: API-side settlement time, for display and audit only. Clients MUST judge freshness by their own receive time (not this field) to stay immune to clock skew; see web metrics.store.
          queue:
            type: object
            required: [waiting, active, failed]
            properties:
              waiting:
                type: integer
                minimum: 0
              active:
                type: integer
                minimum: 0
              failed:
                type: integer
                minimum: 0
          wsConnections:
            type: integer
            minimum: 0
            description: Instantaneous gauge; not a windowed average.
          worker:
            oneOf:
              - $ref: "#/components/schemas/WorkerMetrics"
              - type: "null"
            description: Null when the worker snapshot is absent, expired, or malformed (degraded output).
          persist:
            type: object
            required: [dropped, failed]
            properties:
              dropped:
                type: integer
                minimum: 0
                description: Records lost on the API history write path (telemetry points dropped on buffer overflow or failed writes, plus discarded errorlogs).
              failed:
                type: integer
                minimum: 0
                description: Failed insertMany batches (telemetry and errorlogs combined).
            description: Optional. Cumulative counters since API process start (not reset per window). Older API versions omit this field; clients MUST tolerate its absence.

  schemas:
    WorkerMetrics:
      type: object
      required: [snapshotAt, llmLatency, cache]
      properties:
        snapshotAt:
          type: string
          format: date-time
        llmLatency:
          type: object
          required: [count, avgMs, p95Ms, maxMs]
          properties:
            count:
              type: integer
              minimum: 0
            avgMs:
              type: [number, "null"]
            p95Ms:
              type: [number, "null"]
            maxMs:
              type: [number, "null"]
          description: avgMs/p95Ms/maxMs are null (not 0) when count is 0.
        cache:
          type: object
          required: [hits, misses, hitRate]
          properties:
            hits:
              type: integer
              minimum: 0
            misses:
              type: integer
              minimum: 0
            hitRate:
              type: [number, "null"]
          description: hitRate is hits / (hits + misses); null (not 0) when the denominator is 0.

    TelemetryPoint:
      type: object
      required: [type, machineId, timestamp, telemetry, state]
      properties:
        type:
          const: machine/data
        machineId:
          type: string
        timestamp:
          type: string
          format: date-time
        telemetry:
          type: object
          required: [temperature, vibration, throughput, errorRate]
          properties:
            temperature:
              type: number
            vibration:
              type: number
            throughput:
              type: number
            errorRate:
              type: number
        state:
          enum: [healthy, warning, critical]

    DiagnosisResult:
      type: object
      required: [summary, severity, likelyCauses, suggestedActions, evidence]
      properties:
        summary:
          type: string
        severity:
          enum: [ok, warning, critical]
        likelyCauses:
          type: array
          items:
            type: string
        suggestedActions:
          type: array
          items:
            type: object
            required: [label, priority]
            properties:
              label:
                type: string
              priority:
                enum: [low, medium, high]
              command:
                type: string
        evidence:
          type: array
          items:
            type: object
            required: [source, excerpt]
            properties:
              source:
                enum: [telemetry, errorlog, maintenance]
              id:
                type: string
              excerpt:
                type: string
