services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # worker 受監督形態（Feature 007，008 收進 demo 分組，與 api／web／seed 同組）。
  # 既有 `docker compose up -d` 只起 infra、行為零變化；全棧 demo 為
  # `docker compose --profile demo up -d --build`。
  worker:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # 明確宣告 image 名——否則 compose 自動生成 <專案名>-worker（專案名取目錄名、不穩定），
    # 與 T022 祕密衛生驗收逐一 docker run 三個具名映像的指令對不上（008 T002）。
    image: flow-gatekeeper-worker:local
    depends_on:
      - redis
      - mongo
    # 監督語意（ADR-002／research D4）：非零退出才重啟（Docker 內建指數退避），
    # 連續失敗 5 次後停止；優雅關閉 exit(0) 不觸發重啟。
    restart: on-failure:5
    # tini 為 PID 1、node 為子行程——同 namespace 對 PID 1 送 SIGSTOP 會被核心忽略，
    # US5 活鎖演練需凍結 node 子行程（research D5）。
    init: true
    # SIGTERM → SIGKILL 寬限：涵蓋 worker.close() 最長收尾（≈ AI_TIMEOUT_MS 30s）＋關閉緩衝（research D7）
    stop_grace_period: 45s
    # 祕密與調參於執行時注入（憲章 VI：不烘入 image）；容器內連線位址由 environment 覆蓋
    env_file: apps/worker/.env
    environment:
      REDIS_HOST: redis
      MONGO_URL: mongodb://mongo:27017/flow-gatekeeper
    # 健康判定（FR-007，僅示警、不自動重啟）：讀 Redis heartbeat key（10s 週期／TTL 30s），
    # 連續 3 次失敗轉 unhealthy——補「行程活著但卡住」的偵測盲點（contracts §3–§4）
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # api（Gateway）受監督形態（Feature 008 US1）。行為與 host 直跑逐項一致，
  # 崩潰自動重啟，停止時在寬限期內優雅收尾且不被重啟（FR-001／FR-003／FR-004）。
  api:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: flow-gatekeeper-api:local
    # 監督語意（沿用 007 worker）：非零退出才重啟，連續 5 次後停止；exit(0) 不觸發重啟。
    restart: on-failure:5
    init: true
    # 15s MUST NOT 照抄 worker 的 45s——後者為涵蓋 AI_TIMEOUT_MS 的 LLM 收尾而算，
    # api 不呼叫 LLM，收尾僅為關閉連線、量級為秒內（FR-004、contracts §4）。
    stop_grace_period: 15s
    depends_on:
      - redis
      - mongo
    # 祕密與調參於執行時注入（憲章 VI）；容器內連線位址由 environment 覆蓋
    env_file: apps/api/.env
    environment:
      REDIS_HOST: redis
      MONGO_URL: mongodb://mongo:27017/flow-gatekeeper
    # 健康判定（FR-011）：/ws 握手收到 system/connected 才算 healthy——證明 Gateway 已 attach，
    # 非只證明行程在聽（api 無 GET 路由，探 HTTP 必得 404）。探針不需 token（research D6）。
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ⚠️ US1 專用暫時發佈（T008）——本 phase 尚無 web 容器，US1 的一致性比對須以 host dev
    # 前端連上容器化 Gateway，而 vite proxy target 寫死 localhost:3000。MUST 於 T012（web
    # 容器交付）移除——全棧模式下 Gateway MUST NOT 另行對外暴露連接埠（FR-006、CHK054）。
    ports:
      - "3000:3000"

volumes:
  redis-data: {}
  mongo-data: {}
